<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEG Quiz</title>
<style>
  :root {
    --bg: #07080d;
    --card: rgba(20, 23, 33, 0.72);
    --gold: #c9a227;
    --gold-soft: #f0d060;
    --gold-deep: #8a6d14;
    --text: #f4f1ea;
    --muted: #9aa0ae;
    --line: rgba(201, 162, 39, 0.35);
    --good: #4cd98a;
    --bad: #e06a6a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  /* ── Animierter Aurora-Hintergrund ─────────────────── */
  .aurora {
    position: fixed;
    inset: -20%;
    z-index: -1;
    background:
      radial-gradient(40% 35% at 20% 25%, rgba(201, 162, 39, 0.28), transparent 70%),
      radial-gradient(35% 40% at 80% 20%, rgba(90, 60, 180, 0.30), transparent 70%),
      radial-gradient(45% 40% at 75% 85%, rgba(201, 162, 39, 0.16), transparent 70%),
      radial-gradient(40% 35% at 25% 80%, rgba(30, 110, 160, 0.22), transparent 70%),
      var(--bg);
    animation: drift 22s ease-in-out infinite alternate;
    filter: saturate(1.15);
  }
  .aurora::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,0.55));
  }
  @keyframes drift {
    0%   { transform: translate3d(-2%, -1%, 0) scale(1); }
    50%  { transform: translate3d(2%, 2%, 0) scale(1.06); }
    100% { transform: translate3d(-1%, 2%, 0) scale(1.03); }
  }

  /* ── Header ─────────────────────────────────────────── */
  header {
    width: 100%;
    max-width: 900px;
    padding: 26px 24px 20px;
    display: flex;
    align-items: center;
    gap: 18px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  header::after {
    content: "";
    position: absolute;
    left: 24px; right: 24px; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
    opacity: 0.8;
  }
  .logo-slot {
    width: 76px; height: 76px;
    flex: 0 0 76px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: rgba(10, 11, 16, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 0 28px rgba(201, 162, 39, 0.45), inset 0 0 14px rgba(201, 162, 39, 0.25);
    animation: pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 22px rgba(201,162,39,.35), inset 0 0 12px rgba(201,162,39,.2); }
    50%      { box-shadow: 0 0 40px rgba(240,208,96,.6), inset 0 0 18px rgba(240,208,96,.35); }
  }
  .logo-slot img { width: 100%; height: 100%; object-fit: contain; padding: 7px; }
  .logo-slot .fallback {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: bold;
    font-size: 24px;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 1px;
  }
  .school-name { display: flex; flex-direction: column; gap: 2px; }
  .school-name .top {
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold-soft);
  }
  .school-name .main {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(20px, 4vw, 30px);
    font-weight: bold;
    line-height: 1.15;
    background: linear-gradient(120deg, #fff 20%, var(--gold-soft) 60%, #fff 90%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .school-name .sub { font-size: 13px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; }

  /* ── Layout ─────────────────────────────────────────── */
  main {
    width: 100%;
    max-width: 900px;
    padding: 34px 24px 60px;
    flex: 1;
    display: flex;
  }
  main > section { width: 100%; }

  .card {
    background: var(--card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 38px 34px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 8%; right: 8%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240,208,96,0.8), transparent);
  }

  /* Einblend-Animation für Karten-Wechsel */
  .card.enter { animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(0.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Fortschritt ────────────────────────────────────── */
  .progress {
    height: 8px;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 14px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
  }
  .progress > div {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-soft));
    background-size: 200% 100%;
    animation: shimmer 2.4s linear infinite;
    box-shadow: 0 0 12px rgba(240, 208, 96, 0.7);
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes shimmer { to { background-position: 200% 0; } }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .meta .score { color: var(--gold-soft); }

  .question {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(20px, 3.4vw, 28px);
    line-height: 1.45;
    margin-bottom: 30px;
    animation: qIn 0.4s ease both;
  }
  @keyframes qIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Antworten ──────────────────────────────────────── */
  .answers { display: grid; gap: 13px; }
  .answer {
    text-align: left;
    font-size: 16px;
    color: var(--text);
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
    transition: transform 0.16s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    animation: qIn 0.4s ease both;
  }
  .answer:nth-child(2) { animation-delay: 0.05s; }
  .answer:nth-child(3) { animation-delay: 0.10s; }
  .answer:nth-child(4) { animation-delay: 0.15s; }
  .answer:hover:not(:disabled) {
    transform: translateX(6px) scale(1.01);
    border-color: var(--gold);
    background: rgba(201, 162, 39, 0.12);
    box-shadow: 0 6px 22px rgba(201, 162, 39, 0.18);
  }
  .answer:active:not(:disabled) { transform: translateX(6px) scale(0.99); }
  .answer:disabled { cursor: default; }
  .answer.correct {
    border-color: var(--good);
    background: rgba(76, 217, 138, 0.16);
    box-shadow: 0 0 22px rgba(76, 217, 138, 0.35);
    animation: pop 0.35s ease;
  }
  .answer.wrong {
    border-color: var(--bad);
    background: rgba(224, 106, 106, 0.16);
    animation: shake 0.4s ease;
  }
  @keyframes pop { 50% { transform: scale(1.03); } }
  @keyframes shake {
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .answer .letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    margin-right: 12px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    color: var(--gold-soft);
    font-size: 13px;
    font-weight: bold;
    vertical-align: middle;
  }
  .feedback { margin-top: 22px; font-size: 15px; min-height: 22px; font-weight: 600; letter-spacing: 0.3px; }
  .feedback.ok { color: var(--good); text-shadow: 0 0 14px rgba(76, 217, 138, 0.5); }
  .feedback.no { color: var(--bad); text-shadow: 0 0 14px rgba(224, 106, 106, 0.4); }

  /* ── Start / Ergebnis ───────────────────────────────── */
  .center { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .center h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(30px, 5.4vw, 48px);
    margin-bottom: 14px;
    background: linear-gradient(120deg, #fff 15%, var(--gold-soft) 50%, var(--gold) 85%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
  }
  .center p { color: var(--muted); margin-bottom: 30px; font-size: 16px; line-height: 1.65; max-width: 520px; }
  .btn {
    font-size: 16px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 15px 40px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-soft), var(--gold));
    background-size: 300% 100%;
    color: #14130c;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(201, 162, 39, 0.4);
    transition: transform 0.18s ease, box-shadow 0.25s ease, background-position 0.5s ease;
    animation: shimmer 3s linear infinite;
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 14px 40px rgba(240, 208, 96, 0.55);
    background-position: 100% 0;
  }
  .btn:active { transform: translateY(0) scale(0.98); }

  .score-big {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(56px, 10vw, 88px);
    font-weight: bold;
    background: linear-gradient(160deg, #fff, var(--gold-soft) 60%, var(--gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 22px rgba(240, 208, 96, 0.45));
    margin: 12px 0 6px;
    line-height: 1;
  }
  .score-label { color: var(--muted); margin-bottom: 28px; letter-spacing: 3px; text-transform: uppercase; font-size: 13px; }
  .stars { font-size: 34px; letter-spacing: 8px; margin-bottom: 8px; filter: drop-shadow(0 0 12px rgba(240,208,96,0.6)); }

  footer {
    padding: 18px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="aurora"></div>

<header>
  <div class="logo-slot" id="logoSlot">
    <span class="fallback">FEG</span>
  </div>
  <div class="school-name">
    <span class="top">FEG</span>
    <span class="main">Friedrich-Wilhelm-Gymnasium</span>
    <span class="sub">Köln</span>
  </div>
</header>

<main>
  <section id="screen-start" class="card center">
    <h1>Willkommen zum Quiz</h1>
    <p id="start-text">Teste dein Wissen – viel Erfolg!</p>
    <button class="btn" id="btn-start">Quiz starten</button>
  </section>

  <section id="screen-quiz" class="card hidden">
    <div class="progress"><div id="progressBar"></div></div>
    <div class="meta">
      <span id="meta-count">Frage 1</span>
      <span class="score" id="meta-score">Punkte: 0</span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="answers" id="answersBox"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <section id="screen-end" class="card center hidden">
    <div class="stars" id="stars">★★★</div>
    <h1>Geschafft!</h1>
    <div class="score-big" id="finalScore">0 / 0</div>
    <div class="score-label">Punkte</div>
    <p id="end-text"></p>
    <button class="btn" id="btn-restart">Nochmal spielen</button>
  </section>
</main>

<footer>FEG · Friedrich-Wilhelm-Gymnasium Köln</footer>

<script src="questions.js"></script>
<script>
  const LETTERS = ["A", "B", "C", "D", "E", "F"];
  let order = [];
  let index = 0;
  let score = 0;

  const $ = id => document.getElementById(id);

  (function loadLogo() {
    const slot = $("logoSlot");
    const tryLoad = (src) => new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(src);
      img.onerror = () => resolve(null);
      img.src = src;
    });
    tryLoad("logo.svg").then(svg => svg ? svg : tryLoad("logo.png")).then(src => {
      if (src) {
        slot.innerHTML = "";
        const img = document.createElement("img");
        img.src = src;
        img.alt = "FEG Logo";
        slot.appendChild(img);
      }
    });
  })();

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function show(id) {
    ["screen-start", "screen-quiz", "screen-end"].forEach(s => $(s).classList.add("hidden"));
    const el = $(id);
    el.classList.remove("hidden");
    el.classList.remove("enter");
    void el.offsetWidth; // Animation neu starten
    el.classList.add("enter");
  }

  function startQuiz() {
    order = shuffle(QUESTIONS);
    index = 0;
    score = 0;
    $("start-text").textContent = QUESTIONS.length + " Fragen warten auf dich – viel Erfolg!";
    show("screen-quiz");
    renderQuestion();
  }

  function renderQuestion() {
    const item = order[index];
    $("meta-count").textContent = "Frage " + (index + 1) + " / " + order.length;
    $("meta-score").textContent = "Punkte: " + score;
    $("progressBar").style.width = (index / order.length * 100) + "%";
    $("questionText").textContent = item.q;
    $("feedback").textContent = "";
    $("feedback").className = "feedback";

    const box = $("answersBox");
    box.innerHTML = "";
    const pairs = item.answers.map((text, i) => ({ text, ok: i === item.correct }));
    shuffle(pairs).forEach((pair, i) => {
      const btn = document.createElement("button");
      btn.className = "answer";
      btn.innerHTML = '<span class="letter">' + LETTERS[i] + "</span>" + pair.text;
      btn.onclick = () => answer(btn, pair.ok);
      box.appendChild(btn);
    });
  }

  function answer(btn, ok) {
    const buttons = Array.from(document.querySelectorAll(".answer"));
    buttons.forEach(b => b.disabled = true);
    const fb = $("feedback");
    if (ok) {
      score++;
      btn.classList.add("correct");
      fb.textContent = "Richtig! Stark!";
      fb.classList.add("ok");
    } else {
      btn.classList.add("wrong");
      fb.textContent = "Leider falsch – die richtige Antwort leuchtet auf.";
      fb.classList.add("no");
      highlightCorrect(buttons, order[index]);
    }
    $("meta-score").textContent = "Punkte: " + score;
    setTimeout(next, ok ? 900 : 1600);
  }

  function highlightCorrect(buttons, item) {
    const correctText = item.answers[item.correct];
    buttons.forEach(b => {
      const txt = b.textContent.replace(/^[A-F]\s*/, "");
      if (txt === correctText) b.classList.add("correct");
    });
  }

  function next() {
    index++;
    if (index >= order.length) {
      $("progressBar").style.width = "100%";
      const total = order.length;
      const pct = total ? score / total : 0;
      $("stars").textContent = pct === 1 ? "★★★" : pct >= 0.66 ? "★★☆" : pct >= 0.33 ? "★☆☆" : "☆☆☆";
      animateScore(score, total);
      let msg;
      if (pct === 1) msg = "Perfekt! Ein makelloses Ergebnis – absolute Spitzenklasse!";
      else if (pct >= 0.7) msg = "Sehr stark! Fast alles richtig.";
      else if (pct >= 0.4) msg = "Guter Einstand – weiter so!";
      else msg = "Aller Anfang ist schwer – beim nächsten Mal klappt's besser!";
      $("end-text").textContent = msg;
      show("screen-end");
    } else {
      renderQuestion();
    }
  }

  function animateScore(score, total) {
    const el = $("finalScore");
    const dur = 900;
    const t0 = performance.now();
    function tick(t) {
      const p = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(score * eased) + " / " + total;
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  $("btn-start").onclick = startQuiz;
  $("btn-restart").onclick = startQuiz;
</script>
</body>
</html>
